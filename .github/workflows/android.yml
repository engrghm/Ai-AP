name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic and build APK
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "AiAP-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AiAP-apk
          path: android/AiAP-${{ github.run_number }}.apk

      # A release gives a direct download link you can open on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "আমার সহকারী — বিল্ড ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: android/AiAP-${{ github.run_number }}.apk
